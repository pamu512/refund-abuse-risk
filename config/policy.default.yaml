# Ops-tunable policy overlay. Learning-primary: hard gates are safety only.
# Behavioral patterns are learned by the model; tune head thresholds in
# operating_point.default.yaml (or via scripts/backtest.py --tune).
defaults:
  windows_days: [7, 30, 90]
  hard_gates:
    # Only proven/strong fraud labels force auto_deny. Everything else is a feature.
    strong_fraud_label: true

  evidence_weights:
    user: 0.25
    driver: 0.15
    vendor: 0.15
    ud: 0.10
    uv: 0.10
    vd: 0.08
    uvd: 0.12
    device: 0.05

# Market overlays no longer patch rate/LTV hard gates (removed).
# Use operating_point head_thresholds or market-specific models instead.
overlays: []
