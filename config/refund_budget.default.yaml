# Downstream refund-budget contract (advisory hints on the snapshot).
version: "0.1.0"
enabled: true

# Rolling window for budget features (must exist on the order/feature row).
window_days: 30
# Soft caps — downstream may enforce stricter policy.
max_auto_grants_30d: 3
max_refund_gmv_pct_30d: 0.35
max_refund_count_30d: 5

# Map budget pressure → suggested friction.
pressure_effects:
  elevated: refund_step_up
  exhausted: refund_manual_review

# When true, floor refund_effect up to pressure_effects if stricter than rules/tier.
apply_as_effect_floor: true
