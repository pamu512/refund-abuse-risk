# Strict floors for production-shaped OOT packs (not demo CI).
# Schema validation uses min_pack_n / proven; eval_oot_pack enforces min_holdout_n
# after the time split. Synth AP may still fail — expected for the fixture.

min_pack_n: 100
min_holdout_n: 100
min_proven_positives: 15
min_fraud_proven_average_precision: 0.35
min_fraud_proven_precision_at_soft: 0.20
max_decision_ece: 0.20
require_serve_path: true
# Ops freshness (also set monitoring.max_ops_snapshot_age_hours on live OP).
max_ops_snapshot_age_hours: 24
