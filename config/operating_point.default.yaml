# Suggested tiers from calibrated decision_score. Downstream owns enforcement.
model_version: "0.6.2"
policy_version: "0.6.2"

# decision_primary: tier from joint decision_score ladder (heads = evidence).
# learning_primary: legacy OR of abuse/fraud head thresholds.
# score_only: map display score via tiers.*.max_score.
decision_mode: decision_primary

# Display blend (monitoring). Joint decision_score is authoritative for tiers.
score_display:
  abuse: 0.5
  fraud: 0.5

# Joint decision ladder — primary cutoffs (no retrain to move these).
decision_thresholds:
  soft_friction: 35
  hold_review: 50
  auto_deny: 75

# Market×vertical ladders. Most-specific match wins
# (market+vertical > market > vertical > bare); YAML order breaks ties.
# Demo seeds so serve is slice-aware out of the box; replace via
#   python scripts/backtest.py --write-slice-overlays … && promote_overlays.py
decision_threshold_overlays:
  - market: SG
    vertical: food
    soft_friction: 32
    hold_review: 48
    auto_deny: 72
  - market: ID
    vertical: food
    soft_friction: 30
    hold_review: 46
    auto_deny: 70
# Optional sidecar (merged when inline list is empty):
# decision_threshold_overlays_file: decision_threshold_overlays.demo.yaml

# Head thresholds — evidence, baseline under_threshold, legacy learning_primary.
# Soft also used for costed head diagnostics in backtest.
head_thresholds:
  target_pattern_recall: 0.98
  min_precision_at_soft: 0.15
  # Mean FP refund $ at soft (demo ceiling; retune from finance on live OOT).
  max_fp_refund_dollars_mean: 25.0
  abuse_soft_friction: 35
  fraud_soft_friction: 30
  abuse_hold_review: 50
  fraud_hold_review: 45
  abuse_auto_deny: 75
  fraud_auto_deny: 65

# Secondary (used only when decision_mode: score_only).
tiers:
  auto_approve:
    max_score: 25
  soft_friction:
    max_score: 50
  hold_review:
    max_score: 75
  auto_deny:
    max_score: 100

entity_risk_change_delta: 10.0

# Calibration / drift / ops promote gates (backtest blocks promote when breached).
monitoring:
  max_decision_ece: 0.20
  max_decision_brier: 0.25
  ece_binning: adaptive
  min_ece_positives: 5
  min_ece_bin_n: 3
  min_proven_for_ece: 5
  precision_bootstrap_n: 400
  # Optional: also require bootstrap lo ≥ min_precision_at_soft.
  require_precision_bootstrap_ci: false
  max_psi_train_test: 0.35
  # Fail-closed when set: missing/stale ops_snapshot.as_of blocks promote.
  max_ops_snapshot_age_hours: 24
  # Ops proxies from dual-run (CS / overrides / refund $). Null ceiling = ungated.
  max_hold_rate: 0.55
  max_live_override_rate: 0.35
  max_refund_grant_rate: 0.90
  # Demo $ / CS ceilings — retune from live ops_snapshot cron.
  max_refund_dollar_per_order: 12.0
  max_cs_queue_depth: 500
  max_shadow_override_rate: 0.40
  # No baked-in ops_snapshot (stale seeds fail the age gate).
  # Merge live values via data/ops_snapshot.json (pull_production_feeds /
  # ingest_ops_snapshot) before promote.
