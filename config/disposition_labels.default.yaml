# Map refund/claim dispositions → training labels (closed-loop feedback).
# Downstream disposition systems own enforcement; this only mints labels.
version: "0.2.0"

# Later dispositions win when multiple rows share an order_id.
prefer_latest: true

# Label lag: disposition must be >= order.event_ts + lag_days (and <= as_of if set).
# Prevents same-day investigator labels from contaminating score-time training sims.
lag_days: 7
require_order_event_ts: true

outcomes:
  investigator_confirmed_fraud:
    abuse_label: 1
    abuse_label_weak: 0
    fraud_label: 1
    fraud_label_source: proven
    strong_fraud_label: 1
    weak_policy_negative: 0
  chargeback_lost:
    abuse_label: 1
    abuse_label_weak: 0
    fraud_label: 1
    fraud_label_source: proven
    strong_fraud_label: 1
    weak_policy_negative: 0
  # Bank / issuer dispute — same hard-truth semantics as chargeback_lost.
  bank_dispute_lost:
    abuse_label: 1
    abuse_label_weak: 0
    fraud_label: 1
    fraud_label_source: proven
    strong_fraud_label: 1
    weak_policy_negative: 0
  manual_denied_abuse:
    abuse_label: 1
    abuse_label_weak: 0
    fraud_label: 0
    fraud_label_source: ""
    strong_fraud_label: 0
    weak_policy_negative: 0
  manual_denied_fraud:
    abuse_label: 1
    abuse_label_weak: 0
    fraud_label: 1
    fraud_label_source: proven
    strong_fraud_label: 0
    weak_policy_negative: 0
  blocked_auto:
    abuse_label: 1
    abuse_label_weak: 1
    fraud_label: 0
    fraud_label_source: ""
    strong_fraud_label: 0
    weak_policy_negative: 0
  weak_policy_auto_grant:
    abuse_label: 0
    abuse_label_weak: 0
    fraud_label: 0
    fraud_label_source: ""
    strong_fraud_label: 0
    weak_policy_negative: 1
  investigator_cleared:
    abuse_label: 0
    abuse_label_weak: 0
    fraud_label: 0
    fraud_label_source: ""
    strong_fraud_label: 0
    weak_policy_negative: 0
  step_up_granted:
    # Friction cleared — treat as weak abuse signal only if also marked abusive_pattern.
    abuse_label: 0
    abuse_label_weak: 0
    fraud_label: 0
    fraud_label_source: ""
    strong_fraud_label: 0
    weak_policy_negative: 0
